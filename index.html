<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Capex Top Monitor | 宏觀預警終端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <!-- Header -->
  <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-800 gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        AI Capex 宏觀見頂早期預警系統
      </h1>
      <p class="text-xs text-slate-400 mt-1">追蹤 5 大核心維度：算力現貨租金、ODM營收、CoWoS交期、設備訂單比、巨頭剪刀差</p>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="testTelegramAlert()" class="px-3 py-1.5 text-xs bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium transition">
        測試 Telegram 推播
      </button>
      <button onclick="evaluateAllRules()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded border border-slate-700 transition">
        手動重整評估
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- 左側：綜合風險總覽卡片 -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col justify-between">
      <div>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">當前綜合警報指數</h2>
        <div class="mt-4 flex items-baseline gap-2">
          <span id="composite-score" class="text-5xl font-extrabold text-white">0</span>
          <span class="text-sm text-slate-400">/ 100</span>
        </div>
        <div id="risk-badge" class="mt-3 inline-block px-2.5 py-1 text-xs font-semibold rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
          🟢 低風險：擴張週期持續
        </div>
        <p class="text-xs text-slate-400 mt-4 leading-relaxed">
          當綜合風險指數超過 <strong class="text-amber-300">50 分（黃燈）</strong> 時提示大盤溢價脆弱；超過 <strong class="text-rose-400">75 分（紅燈）</strong> 時強制觸發對沖避險操作。
        </p>
      </div>

      <!-- Telegram 配置區 -->
      <div class="mt-6 pt-6 border-t border-slate-800">
        <h3 class="text-xs font-semibold text-slate-300 mb-2">通知設定 (Telegram Webhook)</h3>
        <input id="tg-token" type="text" placeholder="Bot Token" class="w-full text-xs bg-slate-950 border border-slate-800 rounded p-2 text-slate-300 mb-2 focus:outline-none focus:border-indigo-500">
        <input id="tg-chat-id" type="text" placeholder="Chat ID" class="w-full text-xs bg-slate-950 border border-slate-800 rounded p-2 text-slate-300 focus:outline-none focus:border-indigo-500">
      </div>
    </div>

    <!-- 右側：5 大維度指標矩陣 -->
    <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4" id="cards-container">
      <!-- 指標卡片將由 JS 自動生成 -->
    </div>

  </main>

  <script>
    // 5 大監控維度定義與初始閥值
    const METRICS = [
      {
        id: "gpu_spot",
        title: "1. 二級算力租賃現貨價",
        source: "Vast.ai / RunPod (H100/H200)",
        currentValue: 2.15,
        unit: "$/hr",
        threshold: 1.85,
        conditionDesc: "現貨租金跌破 1 年期合約價 ($1.85) 或 30 天跌幅 > 15%",
        weight: 20,
        evalRule: (val, th) => val < th ? 'CRITICAL' : (val < th * 1.1 ? 'WARNING' : 'NORMAL')
      },
      {
        id: "odm_revenue",
        title: "2. 台系 ODM 伺服器營收",
        source: "廣達/緯穎/鴻海 MoM (TWSE)",
        currentValue: 3.2,
        unit: "% (MoM)",
        threshold: 0.0,
        conditionDesc: "伺服器月營收出現連續 2 個月 MoM 負增長 (< 0%)",
        weight: 25,
        evalRule: (val, th) => val < -2.0 ? 'CRITICAL' : (val < 0.0 ? 'WARNING' : 'NORMAL')
      },
      {
        id: "cowos_leadtime",
        title: "3. CoWoS 先進封裝交期",
        source: "台積電供應鏈訪查 / 法說",
        currentValue: 28,
        unit: "週 (Weeks)",
        threshold: 20,
        conditionDesc: "交期從擴張高點驟降至正常安全水位 (<= 20 週)",
        weight: 20,
        evalRule: (val, th) => val <= 20 ? 'CRITICAL' : (val <= 24 ? 'WARNING' : 'NORMAL')
      },
      {
        id: "asml_bookings",
        title: "4. 半導體設備訂單出貨比",
        source: "ASML 季度 Net Bookings / Sales",
        currentValue: 1.15,
        unit: "Book-to-Bill",
        threshold: 1.0,
        conditionDesc: "Book-to-Bill 比率跌破 1.0 或淨預訂量 YoY 下跌 > 20%",
        weight: 15,
        evalRule: (val, th) => val < 0.9 ? 'CRITICAL' : (val < 1.0 ? 'WARNING' : 'NORMAL')
      },
      {
        id: "capex_scissor",
        title: "5. 巨頭 Capex 剪刀差",
        source: "MSFT/GOOG/AMZN/META 10-Q",
        currentValue: 8.5,
        unit: "% 差值",
        threshold: 15.0,
        conditionDesc: "Capex YoY 增長率 超出 雲端營收 YoY 增長率達 15% 以上",
        weight: 20,
        evalRule: (val, th) => val >= 15.0 ? 'CRITICAL' : (val >= 10.0 ? 'WARNING' : 'NORMAL')
      }
    ];

    function renderCards() {
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      METRICS.forEach(metric => {
        const status = metric.evalRule(metric.currentValue, metric.threshold);
        let badgeColor = "bg-emerald-950 text-emerald-400 border-emerald-800";
        let statusText = "🟢 正常";

        if (status === 'WARNING') {
          badgeColor = "bg-amber-950 text-amber-400 border-amber-800";
          statusText = "🟡 警戒";
        } else if (status === 'CRITICAL') {
          badgeColor = "bg-rose-950 text-rose-400 border-rose-800";
          statusText = "🔴 見頂警報";
        }

        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-sm font-semibold text-white">${metric.title}</h3>
              <span class="text-xs px-2 py-0.5 rounded border ${badgeColor}">${statusText}</span>
            </div>
            <p class="text-xs text-slate-400">${metric.source}</p>
            <div class="mt-3 flex items-baseline gap-2">
              <span class="text-2xl font-bold text-slate-100">${metric.currentValue}</span>
              <span class="text-xs text-slate-400">${metric.unit}</span>
            </div>
            <p class="text-xs text-slate-500 mt-2">觸發條件：${metric.conditionDesc}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-xs text-slate-400">
            <span>權重: ${metric.weight}%</span>
            <button onclick="editValue('${metric.id}')" class="text-indigo-400 hover:text-indigo-300">模擬數值</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function evaluateAllRules() {
      let totalRisk = 0;
      let criticalCount = 0;

      METRICS.forEach(metric => {
        const status = metric.evalRule(metric.currentValue, metric.threshold);
        if (status === 'CRITICAL') {
          totalRisk += metric.weight;
          criticalCount++;
        } else if (status === 'WARNING') {
          totalRisk += (metric.weight * 0.4);
        }
      });

      const scoreEl = document.getElementById("composite-score");
      const badgeEl = document.getElementById("risk-badge");
      scoreEl.innerText = Math.round(totalRisk);

      if (totalRisk >= 70) {
        badgeEl.className = "mt-3 inline-block px-2.5 py-1 text-xs font-semibold rounded bg-rose-950 text-rose-400 border border-rose-800";
        badgeEl.innerText = "🔴 極度危險：觸發宏觀對沖機制";
      } else if (totalRisk >= 40) {
        badgeEl.className = "mt-3 inline-block px-2.5 py-1 text-xs font-semibold rounded bg-amber-950 text-amber-400 border border-amber-800";
        badgeEl.innerText = "🟡 警訊累積：AI Capex 擴張動能減速";
      } else {
        badgeEl.className = "mt-3 inline-block px-2.5 py-1 text-xs font-semibold rounded bg-emerald-950 text-emerald-400 border border-emerald-800";
        badgeEl.innerText = "🟢 低風險：硬體供應鏈持續拉貨";
      }

      renderCards();
    }

    function editValue(id) {
      const metric = METRICS.find(m => m.id === id);
      const newVal = prompt(`請輸入 ${metric.title} 的模擬數值 (${metric.unit}):`, metric.currentValue);
      if (newVal !== null && !isNaN(parseFloat(newVal))) {
        metric.currentValue = parseFloat(newVal);
        evaluateAllRules();
      }
    }

    async function testTelegramAlert() {
      const token = document.getElementById("tg-token").value.trim();
      const chatId = document.getElementById("tg-chat-id").value.trim();
      if (!token || !chatId) {
        alert("請先填寫 Telegram Bot Token 與 Chat ID！");
        return;
      }

      const text = `🚨 [AI Capex 見頂預警測試]\n當前綜合風險評分: ${document.getElementById("composite-score").innerText}/100\n監控節點運作正常。`;
      try {
        const resp = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: chatId, text: text })
        });
        const data = await resp.json();
        if (data.ok) alert("Telegram 警報發送成功！");
        else alert("發送失敗: " + data.description);
      } catch (err) {
        alert("發送出錯: " + err.message);
      }
    }

    // 初始化渲染
    evaluateAllRules();
  </script>
</body>
</html>
