name: Run Macro AI Capex Monitor

on:
  schedule:
    # 每週六 UTC 01:00 (香港時間週六 09:00) 自動發送週報
    - cron: '0 1 * * 6'
  workflow_dispatch: # 支援手動隨時觸發

permissions:
  contents: write # 授予 Actions 自動提交 state.json 的權限

jobs:
  check-indicators:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫
        uses: actions/checkout@v4

      - name: 設置 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install requests

      - name: 執行監控與警報判定
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_engine.py

      - name: 自動保存狀態記憶 (Commit state.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist monitor state [skip ci]" && git push)
