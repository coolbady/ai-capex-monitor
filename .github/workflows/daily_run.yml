name: Run Macro AI Capex Monitor

on:
  schedule:
    # 每週六 UTC 01:00 (香港時間週六 09:00) 自動發送週報
    - cron: '0 1 * * 6'
  workflow_dispatch: # 依然保留手動點擊按鈕隨時測試

jobs:
  check-indicators:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫
        uses: actions/checkout@v3

      - name: 設置 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install requests

      - name: 執行監控與警報判定
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_engine.py
